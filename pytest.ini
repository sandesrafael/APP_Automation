[pytest]
# Configuração do pytest para o projeto APP_Automation

# Configuração do pytest-asyncio
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Diretório de testes
testpaths = tests

# Padrões de arquivos de teste
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Configuração de output
addopts = 
    -v
    --tb=short
    --strict-markers
    -ra

# Markers customizados
markers =
    unit: Testes unitários isolados
    integration: Testes de integração de APIs
    e2e: Testes end-to-end completos
    slow: Testes que demoram mais tempo
    api: Testes específicos de API

# Configuração de warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Configuração de logging para testes
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout para testes (requer pytest-timeout)
# timeout = 300

# Cobertura de código (requer pytest-cov)
# Descomentado quando usar: pytest --cov=src --cov-report=html
